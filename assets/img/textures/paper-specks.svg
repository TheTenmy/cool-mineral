<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360">
  <!-- светлые крапинки для тёмного картона и стола -->
  <filter id="specks">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.93  0 0 0 0 0.9  0 0 0 0 0.84  0 0 0 1.4 -0.78"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#specks)"/>
</svg>
