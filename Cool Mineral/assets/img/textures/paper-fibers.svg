<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480">
  <!-- вытянутый по горизонтали шум даёт волокна, как у газетной бумаги -->
  <filter id="fibers">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.42" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.37  0 0 0 0 0.29  0 0 0 0.22 -0.06"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#fibers)"/>
</svg>
